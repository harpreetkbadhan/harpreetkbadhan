name: Generate contribution snake

on:
  schedule:
    - cron: "0 3 * * *" # daily, 03:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs in profile blues
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#2563eb&color_dots=#ebedf0,#bfdbfe,#60a5fa,#2563eb,#1e3a8a
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#60a5fa&color_dots=#161b22,#1e3a8a,#1d4ed8,#3b82f6,#93c5fd

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
