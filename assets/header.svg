<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Harpreet Kumar. Senior React Native and Full-Stack Engineer, Berlin.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0f2a5a"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#93c5fd" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1200" height="300" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <!-- soft orbs -->
    <circle cx="1010" cy="70" r="150" fill="#3b82f6" fill-opacity="0.22"/>
    <circle cx="1120" cy="230" r="110" fill="#60a5fa" fill-opacity="0.18"/>
    <circle cx="140" cy="290" r="130" fill="#1d4ed8" fill-opacity="0.25"/>
    <!-- subtle grid -->
    <g stroke="#ffffff" stroke-opacity="0.05">
      <path d="M0 75H1200M0 150H1200M0 225H1200"/>
      <path d="M150 0V300M300 0V300M450 0V300M600 0V300M750 0V300M900 0V300M1050 0V300"/>
    </g>
    <!-- code glyph on the right -->
    <g fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" transform="translate(960 92)">
      <path d="M40 20 L8 60 L40 100"/>
      <path d="M130 20 L162 60 L130 100"/>
      <path d="M100 8 L70 112"/>
    </g>
    <!-- waves -->
    <path d="M0 232 C 200 190, 320 280, 520 236 C 720 192, 860 268, 1040 230 C 1120 213, 1170 222, 1200 232 L1200 300 L0 300 Z" fill="#ffffff" fill-opacity="0.07"/>
    <path d="M0 258 C 180 226, 340 296, 540 262 C 740 228, 900 292, 1200 254 L1200 300 L0 300 Z" fill="#ffffff" fill-opacity="0.10"/>
    <!-- text -->
    <text x="72" y="128" fill="#ffffff" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="-1.5">Harpreet Kumar</text>
    <rect x="74" y="146" width="150" height="4" rx="2" fill="url(#glow)"/>
    <text x="72" y="190" fill="#e2e8f0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="500">Senior React Native &amp; Full-Stack Engineer · Berlin</text>
    <g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#dbeafe">
      <rect x="72" y="214" width="124" height="34" rx="17" fill="#ffffff" fill-opacity="0.12"/><text x="134" y="236" text-anchor="middle">React Native</text>
      <rect x="206" y="214" width="110" height="34" rx="17" fill="#ffffff" fill-opacity="0.12"/><text x="261" y="236" text-anchor="middle">TypeScript</text>
      <rect x="326" y="214" width="84" height="34" rx="17" fill="#ffffff" fill-opacity="0.12"/><text x="368" y="236" text-anchor="middle">Next.js</text>
      <rect x="420" y="214" width="130" height="34" rx="17" fill="#ffffff" fill-opacity="0.12"/><text x="485" y="236" text-anchor="middle">Swift &amp; Kotlin</text>
      <rect x="560" y="214" width="84" height="34" rx="17" fill="#ffffff" fill-opacity="0.12"/><text x="602" y="236" text-anchor="middle">NestJS</text>
      <rect x="654" y="214" width="140" height="34" rx="17" fill="#ffffff" fill-opacity="0.12"/><text x="724" y="236" text-anchor="middle">AI coding agents</text>
    </g>
  </g>
</svg>
