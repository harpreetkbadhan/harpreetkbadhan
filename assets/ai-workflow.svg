<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="How I work with AI coding agents: plan: scope, constraints &amp; acceptance criteria, written first; build: small, reviewable diffs · tests run on every step; review: I read every diff · check it on a real device · then a PR; context: rules, skills &amp; hooks live in git, reviewed like code; tools: MCP → Figma · Sentry · GitHub · Linear · browser automation; guard: allowlists + pre-tool hooks: no destructive commands, secrets or user data; product: in-app assistant on OpenAI + Anthropic, read-only: a person completes the action"><defs>
