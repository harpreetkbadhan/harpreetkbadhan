<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="budgetSum, a bills and payments app built and run solo. Product: Reminders before every bill is due; Loans &amp; instalments tracked to the last rate; See what's left this month after all bills; Invite your partner for free; No bank login · GDPR, hosted in the EU. Engineering: React Native + TypeScript client; NestJS + MongoDB API; RevenueCat + StoreKit, server-side entitlements; Idempotent webhooks · push notifications; 6 subscription tiers · 8 languages. Download on the App Store."><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset=".55" stop-color="#0f2a5a"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
